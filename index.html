<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TwoFlip — KREAM 링크로 신청하는 구매대행</title>
  <meta name="description" content="KREAM 상품 링크를 남기면 공식몰·오프라인 매장에서 확보해 연락드립니다.">
  <link rel="stylesheet" href="assets/css/app.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <span class="logo">TwoFlip</span>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>KREAM 링크 하나로 신청하세요</h1>
      <p>원하는 상품의 KREAM 주소를 남기면, 공식몰과 오프라인 매장에서 확보한 뒤 연락드립니다.</p>
      <!-- 소개·가격 기준·진행 단계는 사업계획서 확정 후 채운다 -->
    </section>

    <section class="steps" aria-label="진행 순서">
      <ol>
        <li><strong>신청</strong><span>KREAM 주소와 사이즈를 남깁니다</span></li>
        <li><strong>확보</strong><span>공식몰·매장에서 상품을 찾습니다</span></li>
        <li><strong>연락</strong><span>확보되면 가격과 함께 연락드립니다</span></li>
        <li><strong>확정</strong><span>확인 후 결제하면 거래가 끝납니다</span></li>
      </ol>
    </section>

    <section class="card">
      <h2>구매 신청</h2>
      <form id="apply-form" novalidate>
        <div class="field">
          <label for="kreamUrl">KREAM 상품 주소</label>
          <input id="kreamUrl" name="kreamUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://kream.co.kr/products/…" required>
          <p class="error" data-error-for="kreamUrl" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="size">사이즈</label>
          <input id="size" name="size" type="text" maxlength="20" placeholder="예: 270, L, FREE" required>
          <p class="error" data-error-for="size" aria-live="polite"></p>
        </div>

        <div class="row">
          <div class="field">
            <label for="name">이름</label>
            <input id="name" name="name" type="text" maxlength="30" autocomplete="name" required>
            <p class="error" data-error-for="name" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="phone">휴대폰 번호</label>
            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-1234-5678" required>
            <p class="error" data-error-for="phone" aria-live="polite"></p>
          </div>
        </div>

        <div class="field">
          <label for="memo">요청사항 <span class="optional">(선택)</span></label>
          <textarea id="memo" name="memo" rows="3" maxlength="500"></textarea>
          <p class="error" data-error-for="memo" aria-live="polite"></p>
        </div>

        <!-- 봇 함정: 사람에겐 보이지 않는다 -->
        <div class="hp" aria-hidden="true">
          <label for="website">웹사이트</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <div class="field consent">
          <label>
            <input type="checkbox" name="consent" value="yes">
            개인정보(이름·휴대폰 번호) 수집·이용에 동의합니다. 신청 처리와 연락에만 씁니다.
          </label>
          <p class="error" data-error-for="consent" aria-live="polite"></p>
        </div>

        <button id="apply-submit" type="submit">신청하기</button>
        <p id="apply-status" class="status" role="status" hidden></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">© TwoFlip</div>
  </footer>
</body>
</html>
